services:
  - type: web
    name: safenest-ai
    runtime: python
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      # API URL của service chính (đã deploy)
      - key: SAFENEST_API_URL
        value: "https://safenestai.onrender.com"

    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"