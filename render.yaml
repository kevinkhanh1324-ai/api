services:
  - type: web
    name: safenest-api
    runtime: python
    plan: free
    envVars:
      # 🔑 BẮT BUỘC: URL kết nối đến Railway MySQL (dùng public proxy)
      - key: MYSQL_PUBLIC_URL
        value: mysql://root:tyDBDKDwgXXuUFhOoeWPFCMELNYvwdYI@turntable.proxy.rlwy.net:18759/railway

      # 🔒 Secret key cho JWT (nên đổi thành chuỗi mạnh trước khi production)
      - key: SAFENEST_SECRET
        value: dev-secret-changeme

      # 🐍 Phiên bản Python
      - key: PYTHON_VERSION
        value: "3.11.0"
      
      # 💳 PayOS Configuration
      - key: PAYPOS_WEBHOOK_URL
        value: "https://safenestai.onrender.com/api/paypos/webhook"
      - key: PAYPOS_RETURN_URL
        value: "https://demo-exe.vercel.app/payment/success"
      - key: PAYPOS_CANCEL_URL
        value: "https://demo-exe.vercel.app/payment/cancel"

    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m uvicorn apiSQL:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 75 --log-level info"